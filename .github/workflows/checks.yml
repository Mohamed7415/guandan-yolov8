name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: artifacts/requirements-inference.txt
      - run: python -m pip install -r artifacts/requirements-inference.txt PyYAML==6.0.2
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts tests
